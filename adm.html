<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المسئول</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #f4f7f6; color: #333; padding: 20px; }
        .header { background: #21353e; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .filters-container { background: white; padding: 15px 20px; border-radius: 15px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border-right: 5px solid #c59736; }
        .filter-group { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 200px; }
        .filter-select { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: 'Cairo'; font-weight: 600; outline: none;}
        .btn-action { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s;}
        .btn-action:hover { filter: brightness(1.1); }
        .table-container { background: white; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); overflow-x: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: #c59736; color: white; padding: 15px; text-align: right; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-weight: 600; }
        tr:hover { background: #f9f9f9; }
        .badge { padding: 5px 10px; border-radius: 5px; font-size: 0.85rem; font-weight: bold;}
        .view-btn { background: #3498db; color: white; padding: 5px 10px; border-radius: 5px; text-decoration: none; font-size: 0.85rem; margin: 2px; display: inline-block; border:none; cursor: pointer;}
        
        /* أزرار الإجراءات */
        .approve-btn { background: #27ae60; color: white; padding: 5px 10px; border-radius: 5px; font-size: 0.85rem; border:none; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.3s;}
        .approve-btn:hover { background: #2ecc71; }
        .reject-btn { background: #e74c3c; color: white; padding: 5px 10px; border-radius: 5px; font-size: 0.85rem; border:none; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.3s;}
        .reject-btn:hover { background: #c0392b; }

        /* نافذة التأكيد الاحترافية */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .custom-alert-box { background: #fff; border-radius: 20px; width: 100%; max-width: 400px; padding: 30px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.3s ease;}
        .alert-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
        .alert-msg { font-size: 1.1rem; font-weight: 600; color: #475569; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>تقرير المسجلين بأعمال الملاحظة</h1>
        <a href="tlogin.html" class="btn-action">خروج المسئول 🚪</a>
    </div>

    <div class="filters-container">
        <div class="filter-group">
            <label>الإدارة:</label>
            <select id="filterAdmin" class="filter-select" onchange="applyFilters()">
                <option value="">الكل</option>
                <option value="إدارة سوهاج التعليمية">إدارة سوهاج التعليمية</option>
                <option value="إدارة أخميم">إدارة أخميم</option>
                <option value="إدارة ساقلته">إدارة ساقلته</option>
                <option value="إدارة جرجا">إدارة جرجا</option>
                <option value="إدارة المنشاة">إدارة المنشاة</option>
                <option value="إدارة البلينا">إدارة البلينا</option>
                <option value="إدارة دار السلام">إدارة دار السلام</option>
                <option value="إدارة المراغة">إدارة المراغة</option>
                <option value="إدارة طهطا">إدارة طهطا</option>
                <option value="إدارة طما">إدارة طما</option>
                <option value="إدارة جهينة">إدارة جهينة</option>
            </select>
        </div>
        <button class="btn-action" style="background:#95a5a6;" onclick="resetFilters()">إلغاء الفلاتر ✖</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>رقم الطلب</th>
                    <th>الاسم</th>
                    <th>الإدارة</th>
                    <th>الموبايل</th>
                    <th>المرفقات</th>
                    <th>القرار / الحالة</th>
                    <th>التاريخ</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="custom-alert-box" id="confirmBox">
            <h3 class="alert-title" id="confirmTitle">تأكيد الإجراء</h3>
            <p class="alert-msg" id="confirmMsg">هل أنت متأكد من هذا الإجراء؟</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-action" id="confirmBtnAction" onclick="executeAction()">تأكيد</button>
                <button class="btn-action" style="background: #95a5a6;" onclick="closeConfirmModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dohaparahesoxfbnogkr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvaGFwYXJhaGVzb3hmYm5vZ2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjExMjgsImV4cCI6MjA5MDUzNzEyOH0.2vyRh9c4w0Rjtq7OYB7xGdKS15bN-naCr0NhpEMMbXQ';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allData = [];
        let selectedUserId = null; 
        let currentActionType = null; // 'approve' or 'reject'

        async function loadReport() {
            const { data } = await supabaseClient.from('observation_requests').select('*').order('created_at', { ascending: false });
            if (data) { allData = data; renderTable(allData); }
        }

        function renderTable(dataToRender) {
            document.getElementById('tableBody').innerHTML = dataToRender.map(user => {
                let statusHtml = '';
                if (user.status === 'موافقة') {
                    statusHtml = `<span class="badge" style="background:#27ae60; color:white;">موافقة ✅</span>`;
                } else if (user.status === 'مرفوض') {
                    statusHtml = `<span class="badge" style="background:#e74c3c; color:white;">مرفوض ❌</span>`;
                } else {
                    statusHtml = `
                        <div style="display:flex; gap:5px;">
                            <button class="approve-btn" onclick="openConfirmModal('${user.id}', 'approve')">قبول</button>
                            <button class="reject-btn" onclick="openConfirmModal('${user.id}', 'reject')">رفض</button>
                        </div>
                    `;
                }

                return `
                <tr>
                    <td style="color:#c59736; font-weight:bold;">${user.request_number || '---'}</td>
                    <td>${user.full_name}</td>
                    <td>${user.admin_name}</td>
                    <td>${user.mobile}</td>
                    <td>
                        ${user.id_front_url ? `<a href="${user.id_front_url}" target="_blank" class="view-btn">الوجه 🖼️</a>` : '-'}
                        ${user.id_back_url ? `<a href="${user.id_back_url}" target="_blank" class="view-btn">الظهر 🖼️</a>` : '-'}
                    </td>
                    <td>${statusHtml}</td>
                    <td style="font-size: 0.8rem; color: #888;">${new Date(user.created_at).toLocaleDateString('ar-EG')}</td>
                </tr>
                `;
            }).join('');
        }

        // 🌟 دالة فتح نافذة التأكيد الذكية 🌟
        function openConfirmModal(userId, actionType) {
            selectedUserId = userId;
            currentActionType = actionType;
            
            const titleEl = document.getElementById('confirmTitle');
            const msgEl = document.getElementById('confirmMsg');
            const btnEl = document.getElementById('confirmBtnAction');
            const boxEl = document.getElementById('confirmBox');

            if (actionType === 'approve') {
                boxEl.style.borderTopColor = '#27ae60';
                titleEl.style.color = '#27ae60';
                titleEl.innerText = 'تأكيد القبول';
                msgEl.innerText = 'هل أنت متأكد من قبول هذا الطلب؟';
                btnEl.style.background = '#27ae60';
                btnEl.innerText = 'نعم، قبول ✅';
            } else {
                boxEl.style.borderTopColor = '#e74c3c';
                titleEl.style.color = '#e74c3c';
                titleEl.innerText = 'تأكيد الرفض';
                msgEl.innerText = 'هل أنت متأكد من رفض هذا الطلب؟';
                btnEl.style.background = '#e74c3c';
                btnEl.innerText = 'نعم، رفض ❌';
            }

            document.getElementById('confirmModal').style.display = 'flex';
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').style.display = 'none';
            selectedUserId = null;
            currentActionType = null;
        }

        async function executeAction() {
            if(selectedUserId && currentActionType) {
                const newStatus = currentActionType === 'approve' ? 'موافقة' : 'مرفوض';
                document.getElementById('confirmModal').style.display = 'none';
                
                await supabaseClient.from('observation_requests').update({ status: newStatus }).eq('id', selectedUserId);
                loadReport(); // تحديث الجدول فوراً
            }
        }

        function applyFilters() {
            const adminVal = document.getElementById('filterAdmin').value;
            renderTable(adminVal ? allData.filter(u => u.admin_name === adminVal) : allData);
        }

        function resetFilters() {
            document.getElementById('filterAdmin').value = "";
            renderTable(allData);
        }

        loadReport();
    </script>
</body>
</html>
