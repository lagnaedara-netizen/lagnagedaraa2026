<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لجنة الإدارة للشهادة الإعدادية - سوهاج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: radial-gradient(circle at center, #35535c, #21353e); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #ffffff; padding: 20px; position: relative; }
        .container { text-align: center; width: 100%; max-width: 650px; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .republic-text { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; color: #ffffff; }
        .eagle-logo { width: 110px; margin-bottom: 25px; filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.5)); }
        .directorate { font-size: 1.4rem; font-weight: 600; margin-bottom: 10px; color: #e0e0e0; }
        .committee-title { font-size: 2.4rem; font-weight: 900; line-height: 1.3; margin-bottom: 15px; text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); }
        .year { font-size: 1.3rem; font-weight: 600; color: #9baab3; margin-bottom: 40px; }
        .gold-name { font-size: 2.2rem; font-weight: 900; background: linear-gradient(to bottom, #fde08b, #b98a31); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; text-shadow: 0px 4px 15px rgba(185, 138, 49, 0.2); }
        .committee-role { font-size: 1.4rem; font-weight: 700; background: linear-gradient(to bottom, #fde08b, #b98a31); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; text-shadow: 0px 4px 15px rgba(185, 138, 49, 0.2); }
        .login-btn { background: linear-gradient(to bottom, #c59736, #9e7320); color: #ffffff; border: none; padding: 10px 60px; font-size: 1.8rem; font-weight: 800; border-radius: 35px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; display: inline-block; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3); }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(197, 151, 54, 0.5); filter: brightness(1.1); }
        .divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.15); width: 80%; margin: 50px auto 20px; }
        .footer { font-size: 1.1rem; font-weight: 600; color: #9baab3; }
        @media (max-width: 600px) {
            .committee-title { font-size: 1.8rem; } .gold-name { font-size: 1.8rem; } .committee-role { font-size: 1.1rem; } .directorate { font-size: 1.2rem; } .republic-text { font-size: 1rem; }
            .login-btn { font-size: 1.5rem; padding: 10px 40px; } .divider { margin: 30px auto 15px; } .footer { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="republic-text">جمهورية مصر العربية</div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Coat_of_arms_of_Egypt_%28Official%29.svg/1200px-Coat_of_arms_of_Egypt_%28Official%29.svg.png" alt="شعار النسر" class="eagle-logo">
        <div class="directorate">مديرية التربية والتعليم بسوهاج</div>
        <h1 class="committee-title">لجنة الإدارة للشهادة<br>الإعدادية</h1>
        <div class="year">العام الدراسي 2025 / 2026</div>
        <div class="gold-name">الأستاذ / أشرف مكى</div>
        <div class="committee-role">رئيس لجنة الإدارة للشهادة الإعدادية</div>
        <a href="tlogin.html" class="login-btn">دخول</a>
        <hr class="divider">
        <div class="footer">إعداد وتصميم / علاء الوكيل</div>
    </div>
</body>
</html>
